[workspace]
members = [
    "crates/jide-core",
    "crates/jide-syntax",
    "crates/jide-search",
    "crates/jide-workspace",
    "crates/jide-platform",
    "crates/jide-ui",
    "crates/jide",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["King (kidev)"]

[workspace.dependencies]
jide-core = { path = "crates/jide-core" }
jide-syntax = { path = "crates/jide-syntax" }
jide-search = { path = "crates/jide-search" }
jide-workspace = { path = "crates/jide-workspace" }
jide-platform = { path = "crates/jide-platform" }
jide-ui = { path = "crates/jide-ui" }

eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "wgpu", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false }
rfd = "0.18.0"
arboard = "3.7.0"
ropey = "1.6.1"
encoding_rs = "0.8.44"
chardetng = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
directories = "6.0.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
crossbeam-channel = "0.5.17"
unicode-width = "0.2.3"
unicode-segmentation = "1.13.3"
clap = { version = "4.6.8", features = ["derive"] }
smallvec = { version = "1.16.5", features = ["union", "const_generics"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
ignore = "0.4.34"
grep-matcher = "0.1.9"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
regex = "1.13.1"
nucleo-matcher = "0.3.1"
notify = "8.2.2"
notify-debouncer-full = "0.7.0"
trash = "5.3.0"
interprocess = "2.4.8"
winres = "0.1.12"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
